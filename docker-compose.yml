services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: watchlist-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=3201
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-15m}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - TMDB_API_KEY=${TMDB_API_KEY}
      - RAWG_API_KEY=${RAWG_API_KEY}
      - CORS_ORIGIN=${CORS_ORIGIN:-https://watchlist.hoodgail.me}
      - FRONTEND_URL=${VITE_FRONTEND_URL:-https://watchlist.hoodgail.me}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID:-}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET:-}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI:-}
      - SMTP_URL=${SMTP_URL:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - CATALOG_EDITOR_IDS=${CATALOG_EDITOR_IDS:-}

    networks:
      - dokploy-network
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.watchlist-api.rule=Host(`watchlist-api.hoodgail.me`)"
      - "traefik.http.routers.watchlist-api.entrypoints=web"
      - "traefik.http.routers.watchlist-api.middlewares=redirect-to-https@file"
      - "traefik.http.routers.watchlist-api.service=watchlist-api"
      - "traefik.http.routers.watchlist-api-secure.rule=Host(`watchlist-api.hoodgail.me`)"
      - "traefik.http.routers.watchlist-api-secure.entrypoints=websecure"
      - "traefik.http.routers.watchlist-api-secure.tls=true"
      - "traefik.http.routers.watchlist-api-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.watchlist-api-secure.service=watchlist-api"
      - "traefik.http.services.watchlist-api.loadbalancer.server.port=3201"
      # Health check
      - "traefik.http.services.watchlist-api.loadbalancer.healthcheck.path=/api/health"
      - "traefik.http.services.watchlist-api.loadbalancer.healthcheck.interval=30s"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3201/api/health",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-https://watchlist-api.hoodgail.me/api}
        - VITE_FRONTEND_URL=${VITE_FRONTEND_URL:-https://watchlist.hoodgail.me}
    container_name: watchlist-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=8080
      - VITE_API_URL=${VITE_API_URL:-https://watchlist-api.hoodgail.me/api}
      - VITE_FRONTEND_URL=${VITE_FRONTEND_URL:-https://watchlist.hoodgail.me}
    networks:
      - dokploy-network
      - internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.watchlist.rule=Host(`watchlist.hoodgail.me`)"
      - "traefik.http.routers.watchlist.entrypoints=web"
      - "traefik.http.routers.watchlist.middlewares=redirect-to-https@file"
      - "traefik.http.routers.watchlist.service=watchlist"
      - "traefik.http.routers.watchlist-secure.rule=Host(`watchlist.hoodgail.me`)"
      - "traefik.http.routers.watchlist-secure.entrypoints=websecure"
      - "traefik.http.routers.watchlist-secure.tls=true"
      - "traefik.http.routers.watchlist-secure.tls.certresolver=letsencrypt"
      - "traefik.http.routers.watchlist-secure.service=watchlist"
      - "traefik.http.services.watchlist.loadbalancer.server.port=8080"
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:8080/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s

networks:
  dokploy-network:
    external: true
  internal:
    driver: bridge
